# =============================================================================
# LivePulse — E2E Regression Test Suite (manual/automation checklist)
# =============================================================================
# Recorded from the verification sessions of 2026-11-22 .. 2026-11-26
# (headless Mac SDK + AVD livepoll_play36 + Firebase livepulse-prod).
#
# Purpose: re-runnable record of every flow exercised, exact steps, expected
# results, and last-known pass/fail — plus the environment gotchas that cost
# debugging time, so they never do again. Structured for later conversion to
# automated tests (Compose UI test / Espresso / Playwright).
#
# Conventions:
#   - "dump" = `adb exec-out uiautomator dump /dev/tty` (parse text/bounds/focused)
#   - Coordinates are for Pixel 8 AVD @ 1080x2400 (420dpi); resolve fresh each run.
# =============================================================================

version: 1
suite: livepulse-e2e-regression
recorded: 2026-11-26
last_full_run: 2026-11-26

environment:
  android:
    toolchain: headless brew SDK (/opt/homebrew/share/android-commandlinetools), JDK 17 keg-only
    avd: livepoll_play36            # Pixel 8, Android 16, google_apis_playstore arm64-v8a
    avd_note: >-
      Play-certified image is REQUIRED for Google-account flows; the plain
      google_apis image dead-ends account-add in a WebView (err 50135).
    launch: emulator -avd livepoll_play36 -no-snapshot-load -dns-server 8.8.8.8
    app_package: com.plutusoft.livepulse
    launch_component: com.plutusoft.livepulse/com.example.MainActivity   # namespace com.example != applicationId
  web:
    local: cd docs && python3 -m http.server 8901   # then http://127.0.0.1:8901/vote.html
    prod: https://livepulse-prod.web.app/vote.html
  backend:
    project: livepulse-prod
    rest_base: https://firestore.googleapis.com/v1/projects/livepulse-prod/databases/(default)/documents

prerequisites:
  - app/google-services.json  # ANDROID app config: client_info.android_client_info.package_name == com.plutusoft.livepulse
  - .env at repo root with real numeric WEB_CLIENT_ID (see .env.example)
  - debug.keystore at repo root; its SHA-1 registered in Firebase console fingerprints
  - Emulator booted AND DNS resolving (see INFRA-01 before anything else)
  - 'App installed: adb install -r app/build/outputs/apk/debug/app-debug.apk'

tests:
  # ---------------- Android app (Guest mode — no sign-in required) ----------
  - id: APP-01
    title: Cold launch & process health
    area: android-app
    steps:
      - Boot AVD (command above). If "System UI isn't responding" ANR appears, tap **Wait** (never "Close app").
      - adb shell am start -n com.plutusoft.livepulse/com.example.MainActivity
      - adb shell pidof com.plutusoft.livepulse
      - adb logcat -d -s FirebaseApp:V AndroidRuntime:E
    expected:
      - Process alive; MainActivity top-resumed (dumpsys activity activities | grep topResumed)
      - 'Logcat line from OUR pid: "Device unlocked: initializing all Firebase APIs for app [DEFAULT]"'
      - No AndroidRuntime FATAL/crash for our pid
      - ("failed to initialize because no default options" from a *different* pid is a system process — ignore)
    result: pass (2026-11-26, pid 5321)
    baseline: cold start 2148 ms, PSS ~130 MB (emulator, 2026-11-25)

  - id: APP-02
    title: Create poll from template (quick create) + cloud publish
    area: android-app
    steps:
      - Home → bottom-right create button (resolve via dump; ~[701,2148][1038,2295])
      - 'Template sheet → tap "Use ➔" on "⚽ Weekend 5v5 Soccer: Match Time & Pitch"'
      - Form opens pre-filled → scroll (gutter swipes, x≈1040) to "Create Poll" → tap
    expected:
      - 'Share dialog renders: "Share Poll with Friends" + 6-char join code'
      - 'adb logcat -d | grep FirestoreService -> shows "Successfully published poll <uuid> (<CODE>) to Cloud Firestore"'
      - REST confirms doc exists under polls/<uuid>
    result: pass (2026-11-26, poll N2X2TJ)
    gotcha: >-
      If the share dialog does NOT render, DO NOT re-tap blindly — the poll may
      still have been created (4 duplicate "Team Lunch Spot" polls, codes
      K4CM9Y/W7MFKZ/5U4EKE/RVCYBX, were born this way while the emulator UI was
      wedged). Check logcat/Room first, then investigate UI state.

  - id: APP-03
    title: Create blank poll with custom title + options (form fill)
    area: android-app
    steps:
      - Create → "Blank Custom Poll"
      - "Fill title: tap field → verify focused=true in dump → adb shell input text 'Text%sWith%sSpaces' (%s = space)"
      - "Fill Option #1 and #2 the same way. BEFORE each: close IME (adb shell input keyevent 4),
        scroll with gutter swipes only, tap field, VERIFY focus moved, then type."
      - Tap "Create Poll"
    expected:
      - 'Validation fires when incomplete: "Please provide at least 2 voting options"'
      - 'With title + 2 options: share dialog with new code (see APP-02 expectations)'
    result: pass (HJ55K7 "Coffee or Tea" 2026-11-25; "Team Lunch Spot" series 2026-11-26)

  - id: APP-04
    title: Cast vote as Guest (in-app)
    area: android-app
    steps:
      - Poll results screen → "Cast Vote"
      - Tap an option → scroll to "Submit Vote & View Results" → tap
    expected:
      - 'Results update: option shows N votes, TOP badge, percentage'
      - 'Single-vote case: "1 vote (100% of total)", "Leading Consensus Choice"'
      - 'Logcat: "Successfully uploaded vote <pollid>_<voterid>_<uuid> to Cloud Firestore"'
    result: pass (HJ55K7 Coffee 100% 2026-11-25; N2X2TJ Riverside 2026-11-26)

  - id: APP-05
    title: Results / Analytics screen rendering
    area: android-app
    steps:
      - Open poll from home list → observe results screen
    expected:
      - 'Tabs: Charts / RSVP (n) / Notes (n); VOTE DISTRIBUTION with per-option % and vote counts'
      - Headcount summary when targetHeadcount > 0; deadline badge ("Ends in Xh Ym" / "Expired")
      - Expired polls auto-file under the "Closed (n)" home tab
    result: pass (2026-11-25/26)

  - id: APP-06
    title: Change vote from the app ("Update Vote") — ballot overwrite
    area: android-app
    steps:
      - Results screen → Cast/Update Vote → pick a different option → Submit
      - REST: list polls/<uuid>/votes — count docs for the voter
    expected:
      - Exactly ONE votes/{voterId} ballot doc in Firestore — no stale per-option docs
      - Total vote count unchanged for this voter's swap (KB-04 regression guard)
    result: 'pass (2026-11-27, emulator battery, poll A5MY5M): app changed Metro→Highland;
      "uploaded ballot guest_local (1 selections)"; emulator held exactly 2 ballot
      docs (one per voter), total stayed 2 votes / 2 participants'

  - id: APP-07
    title: Join poll by code in the app (home "Join" button)
    area: android-app
    steps:
      - Home → "Join" (top-right) → enter the poll's 6-char code
    expected: lands on the poll (results or voting screen); cloud-first lookup
      finds polls created on other devices (repository checks Firestore before Room)
    result: 'pass (2026-11-27, emulator battery): after adb pm clear (empty Room) +
      fresh join by code A5MY5M, poll rendered with all 4 options, and cloud ballots
      arrived too (3 votes / 2 participants, RSVP 2) — cloud-first lookup confirmed'

  - id: APP-08
    title: Close Voting Now → web reflects Closed live
    area: android-app
    steps:
      - Results screen → "Close Voting Now"
      - Watch the open web tab — do NOT reload
    expected:
      - App marks poll closed (badge "Closed", voting controls hidden)
      - Cloud isClosed flips; web live-updates to "Closed" badge and hides the
        vote card via onSnapshot — no reload
    result: 'pass (2026-11-27, emulator battery): Close tap → "Synced poll … status to
      cloud (isClosed=true)"; web (untouched tab) showed badge "Closed", vote card
      hidden, results preserved. NOTE first run pre-fix left Room/cloud divergent
      (local closed, cloud open) — fixed same day (KB-06)'

  # ---------------- Web vote client (docs/vote.html) ------------------------
  - id: WEB-01
    title: 'Join by code renders the poll  (REGRESSION: guards KB-01)'
    area: web-client
    steps:
      - 'Serve docs/ locally: cd docs && python3 -m http.server 8901'
      - Open http://127.0.0.1:8901/vote.html
      - Fill "Poll code" with a live 6-char code → "Open Poll"  (or vote.html?code=XXXXXX auto-join)
    expected:
      - 'Within ~2-3 s the poll view is VISIBLE: icon, code, deadline badge, title,
        options with venue/time/price, live results, headcount'
      - 'NOT an eternal spinner: spinner + empty body = KB-01 regression'
    result: pass (local fixed copy, 2026-11-26) / KNOWN-FAIL on prod until KB-01 is deployed
    bug_ref: KB-01

  - id: WEB-02
    title: Web vote submission (with name + RSVP)
    area: web-client
    steps:
      - 'On an open, multi-select poll: click an option button (checkbox)'
      - Fill "Your name" → click "✓ Going" (RSVP) → "Submit Vote"
    expected:
      - 'View switches to results: chosen option TOP 100%, "1 vote (of 1)", "1 voter"'
      - 'Headcount line: "1 going (+1s included) · target N"'
      - '"Change my vote" button appears'
      - 'REST: polls/<uuid>/votes contains doc with voterName, rsvpStatus: GOING'
    result: pass (2026-11-26, voter "Khoa (web", poll N2X2TJ)

  - id: WEB-03
    title: Change my vote (web)
    area: web-client
    steps:
      - After voting, tap "Change my vote" → adjust selection to a different option → resubmit
      - REST: list polls/<uuid>/votes; count docs for the same voterId
    expected:
      - Old vote doc REPLACED — same voterId contributes exactly one vote
      - Results re-render without inflating the total
    result: 'FAIL (2026-11-27, poll FANZ82 — original finding); PASS on re-run same
      day (emulator battery, poll A5MY5M, ballot fix live): changed Highland→Riverside,
      total stayed 1 vote, exactly one ballot doc remained.'
    bug_ref: KB-04

  - id: WEB-04
    title: Multi-select ballot — two options tallied, swap to one
    area: web-client
    steps:
      - On a multi-select poll, check TWO options → Submit
      - Change my vote → check ONE option (different from either) → Submit
    expected:
      - First submission tallies both selections
      - After the swap exactly one selection counts — the whole ballot is replaced
    result: 'pass (2026-11-27, emulator battery): two selections tallied; later swap to
      a single selection replaced the ballot. Found KB-05 along the way — headcount
      over-counted multi-selection voters (fixed same day, verified via reload).'

  - id: WEB-05
    title: Returning voter after page reload sees "Change my vote"
    area: web-client
    steps:
      - Vote in a session → hard-reload the page (same browser, same localStorage)
    expected: results view with "Change my vote" visible, Submit hidden — the
      listener detects the voter's ballot in the cloud (KB-04 returning-voter fix)
    result: >-
      pass (2026-11-27, emulator battery: reload → changeVisible true, submitHidden true, results
      shown)

  # ---------------- Cross-platform sync ------------------------------------
  - id: SYNC-01
    title: Web vote appears in Android app (web → Firestore → app)
    area: sync
    steps:
      - Complete WEB-02 from the browser
      - On the emulator, keep the app on the poll's RESULTS screen (no VotingScreen visit)
    expected:
      - App distribution live-updates with the web voter's option and correct %
      - RSVP counter incremented — all without leaving the results screen
    result: 'pass (2026-11-26 with VotingScreen-first workaround; re-verified 2026-11-27 after the results-screen listener fix in PollAnalyticsScreen: poll FANZ82, web vote appeared on results screen with no VotingScreen visit)'

  - id: SYNC-02
    title: App vote appears on web without reload (app → Firestore → web)
    area: sync
    steps:
      - Complete APP-04 on the emulator
      - Watch the already-open web tab (onSnapshot live listener) — do NOT reload
    expected:
      - 'Web results update within seconds: total votes +1, percentages re-ranked, TOP badge moves'
    result: 'pass (2026-11-26: web showed "2 votes", Riverside TOP 50% after app vote)'

  - id: SYNC-03
    title: Firestore publish/persist verification (REST)
    area: sync
    steps:
      - 'curl -s $rest_base/polls?pageSize=10 — list polls (code, title, deadlineTimestamp, isClosed)'
      - 'curl -s $rest_base/polls/<uuid>/votes — list vote docs'
      - 'runQuery structured query for code equality (endpoint: documents:runQuery, NOT documents/polls:runQuery)'
    expected: poll + votes present; fields match what the clients wrote
    result: pass (2026-11-26)

  - id: SYNC-04
    title: Web vote CHANGE reaches app without double-count (web → FS → app)
    area: sync
    steps:
      - Web votes option A → app shows it
      - Web changes vote to option B (app parked on results screen)
    expected:
      - App live-updates: A loses the vote, B gains it; totals UNCHANGED
      - Room mirror clears the voter's previous rows (attachLiveCloudSync) — no
        stale A+B pair
    result: 'pass (2026-11-27, emulator battery): web changed Riverside→Central Park
      while app sat on results; app showed Central Park 50% leading, 2 votes / 2
      participants, RSVP (2) — no inflation'

  - id: SYNC-05
    title: App vote CHANGE reaches web without double-count (app → FS → web)
    area: sync
    steps:
      - App votes option A (web shows it) → app updates vote to option B
      - Watch the open web tab — do NOT reload
    expected: web tallies swap A→B live; total unchanged; single ballot doc in
      REST for the app's voterId
    result: 'pass (2026-11-27, emulator battery): app ballot Metro→Highland; web
      (untouched tab) live-updated to 2 votes — Riverside 50% + Highland 50%,
      Metro 0%, headcount correct'

  # ---------------- Environment / infrastructure ---------------------------
  - id: INFRA-01
    title: Emulator DNS health (run FIRST)
    area: infra
    steps:
      - adb shell ping -c 1 -W 3 firestore.googleapis.com
    expected: >-
      resolves + replies. If "unknown host": DNS has died (observed after ~2 days uptime;
      raw 8.8.8.8 ping still works). Restart the AVD with -dns-server 8.8.8.8 (data persists).
    result: conditional (died 2026-11-26, cured by restart)

  - id: INFRA-02
    title: Silent cloud-failure check (local-first masking)
    area: infra
    steps:
      - After any create/vote, grep logcat for FirestoreService lines
    expected: >-
      App is local-first: Room writes succeed even when Firestore is unreachable,
      so cloud failures are SILENT in the UI. The logcat FirestoreService lines
      are the only confirmation that a publish/upload landed. Never trust the UI
      alone for cloud-sync assertions.
    result: informational

  - id: INFRA-04
    title: Local Firestore emulator loop (no deploy needed)
    area: infra
    detail: >-
      Full local e2e without touching prod: firebase emulators:start --only
      firestore --project livepulse-prod (CLI 15.37 requires Java 21+ on PATH
      — brew openjdk@21; Gradle keeps JDK 17). The emulator enforces the LOCAL
      firestore.rules, so rules changes are verifiable before deploy. Wiring:
      web client auto-connects when served from localhost/127.0.0.1
      (connectFirestoreEmulator 127.0.0.1:8080, http-only guard — prod over
      https can never hit it); Android via ./gradlew assembleDebug
      -PfirestoreEmulator=true → BuildConfig.FIRESTORE_EMULATOR →
      firestore.useEmulator("10.0.2.2", 8080) (AVD host loopback). Data is
      in-memory: re-seed the fixture poll after every emulator restart. First
      start downloads the emulator JAR (~200 MB, slow).
    result: >-
      setup verified 2026-11-27 (first fixture battery: see WEB-03/APP-06/SYNC-04/05/WEB-04)
  - id: INFRA-03
    title: Gradle test-suite flake and stale build-cache trap
    area: infra
    detail: >-
      ux_pollListScreen_sparse uses waitUntil(15_000) for allPolls to emit; under
      heavy machine load (emulator + brew + parallel builds) the suite failed at
      15.089s twice with identical code that passes solo and in forced re-runs —
      a load flake, not a regression (verify with a solo run before debugging
      code). Separate trap: testDebugUnitTest reports UP-TO-DATE restored from
      the build cache right after cleanTest — "BUILD SUCCESSFUL in <1s" means
      tests did NOT run. Genuine runs need --rerun-tasks --no-build-cache.
    result: informational (flake observed 2026-11-27; suite green when forced)

# =============================================================================
known_bugs:
  - id: KB-01
    severity: critical (web client unusable for joiners)
    summary: docs/vote.html never calls show("pollView") — join-by-code spins forever
    detail: >-
      The poll onSnapshot callback renders into #pollView but nothing removes
      its "hidden" class; show() is only ever called with loadingView/joinView.
      Data loads correctly — display is the only failure.
    fix: Added show("pollView") in the openPoll onSnapshot callback (docs/vote.html).
    status: FIXED and committed (609cd72, 2026-11-26) — deploy to Firebase Hosting PENDING;
      prod join-by-code stays broken until firebase deploy runs (WEB-01 guards this).
# =============================================================================
# Hard-won automation lessons (adb + uiautomator against this Compose app)
# =============================================================================
automation_notes:
  ime_covering_fields: >-
    The soft keyboard covers the bottom ~800 px. Taps/swipes aimed at covered
    fields land ON THE KEYS — a swipe starting on the keyboard TYPES into the
    focused field (observed: stray "by" typed into an option). Close the IME
    (adb shell input keyevent 4) and re-scroll before touching bottom fields.
  focus_verification: >-
    ALWAYS uiautomator-dump and check focused="true" on the target EditText
    BEFORE adb shell input text — text goes to whatever is focused, silently.
    (Observed: three fields' worth of text concatenated into the title field.)
    Repeated DEL clears a focused field: adb shell input keyevent 67 67 67 ...
  scrolling: >-
    Scroll with gutter swipes (x≈1040, never x<1000) so they can't touch
    fields or keys. The create form re-settles layout after IME close — re-dump
    after every scroll/keyboard transition; stale coordinates miss.
  space_encoding: adb shell input text uses %s for spaces; special chars may need %<hex>.
  invisible_clicks: >-
    A tap that "does nothing" may have worked — the create-form share dialog
    failed to render while the emulator was wedged (4 duplicate polls created).
    Verify effects via logcat/Firestore, not only via screen state.
  mcp_quirks: >-
    android-emulator MCP build_and_run / start_emulator time out at a 30 s
    harness cap but KEEP WORKING in the background — verify with adb devices /
    pgrep qemu instead of retrying. launch_app uses monkey and errored;
    use `adb shell am start -n com.plutusoft.livepulse/com.example.MainActivity`.
    ux-review cli.py: capture is interactive (needs keypresses); dump and perf
    are non-interactive. evaluate() in the browser cannot do dynamic import() —
    inject a <script type=module> into the page for SDK-level probes.

