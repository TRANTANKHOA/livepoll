# =============================================================================
# LivePulse — E2E Regression Test Suite (manual/automation checklist)
# =============================================================================
# Shared context for all e2e test batches in this directory.
# Batches: batch-01-core-session.yml, batch-02-ballot-battery.yml,
# batch-03-write-paths.yml. Conventions:
#   - "dump" = `adb exec-out uiautomator dump /dev/tty` (parse text/bounds/focused)
#   - Coordinates are for Pixel 8 AVD @ 1080x2400 (420dpi); resolve fresh each run.
# =============================================================================

version: 1
suite: livepulse-e2e-regression
recorded: 2026-11-26
last_full_run: 2026-11-26
environment:
  android:
    toolchain: headless brew SDK (/opt/homebrew/share/android-commandlinetools), JDK 17 keg-only
    avd: livepoll_play36            # Pixel 8, Android 16, google_apis_playstore arm64-v8a
    avd_note: >-
      Play-certified image is REQUIRED for Google-account flows; the plain
      google_apis image dead-ends account-add in a WebView (err 50135).
    launch: emulator -avd livepoll_play36 -no-snapshot-load -dns-server 8.8.8.8
    app_package: com.plutusoft.livepulse
    launch_component: com.plutusoft.livepulse/com.example.MainActivity   # namespace com.example != applicationId
  web:
    local: cd docs && python3 -m http.server 8901   # then http://127.0.0.1:8901/vote.html
    prod: https://livepulse-prod.web.app/vote.html
  backend:
    project: livepulse-prod
    rest_base: https://firestore.googleapis.com/v1/projects/livepulse-prod/databases/(default)/documents
prerequisites:
  - app/google-services.json  # ANDROID app config: client_info.android_client_info.package_name == com.plutusoft.livepulse
  - .env at repo root with real numeric WEB_CLIENT_ID (see .env.example)
  - debug.keystore at repo root; its SHA-1 registered in Firebase console fingerprints
  - Emulator booted AND DNS resolving (see INFRA-01 before anything else)
  - 'App installed: adb install -r app/build/outputs/apk/debug/app-debug.apk'
known_bugs:
  - id: KB-01
    severity: critical (web client unusable for joiners)
    summary: docs/vote.html never calls show("pollView") — join-by-code spins forever
    detail: >-
      The poll onSnapshot callback renders into #pollView but nothing removes
      its "hidden" class; show() is only ever called with loadingView/joinView.
      Data loads correctly — display is the only failure.
    fix: Added show("pollView") in the openPoll onSnapshot callback (docs/vote.html).
    status: FIXED and committed (609cd72, 2026-11-26) — deploy to Firebase Hosting PENDING;
      prod join-by-code stays broken until firebase deploy runs (WEB-01 guards this).
  - id: KB-09
    severity: critical (vote integrity — closed polls accept votes)
    summary: Rules accepted votes on CLOSED polls via direct API writes
    detail: >-
      Found by SEC-01 (2026-11-28, batch-5): the votes rule checked pollId match
      and ballot schema but never isClosed — a REST ballot write to closed poll
      A5MY5M was ACCEPTED ("Sneaky Sally"). UIs hide the vote form on closed
      polls; the rules are the only real enforcement.
    fix: >-
      firestore.rules votes create/update now additionally requires
      get(.../polls/$(pollId)).data.isClosed == false. Verified: sneaky write
      PERMISSION_DENIED; legit vote on a fresh open poll ACCEPTED.
    status: FIXED and verified 2026-11-28 (local emulator; deploy pending with KB-01)
  - id: KB-10
    severity: critical (anyone can close/vandalize any open guest poll; closed guest polls are unreopenable)
    summary: Poll-update rule lets ANYONE update ANY open poll; closed guest polls unreopenable
    detail: >-
      Found by SEC-02 (2026-11-28, batch-5): allow update grants non-creators
      every update on open polls (!resource.data.isClosed) — an anonymous
      REST masked-update closed poll KXHFC7. Design reality: guest polls store
      no creatorId and guests are unauthenticated, so "the organizer" cannot be
      identified server-side. Secondary facet: once cloud-closed, a guest poll
      can NEVER be re-opened (non-creator update requires !isClosed) — the
      app's Re-open sync would be silently denied.
    fix: 'none yet — needs a design decision: (a) accept the risk (guest polls
      are disposable; deadlines close them naturally), (b) creator secret
      generated at publish, shared in the share-code payload, required for
      poll-doc updates, or (c) authenticated creators (Google sign-in) owning
      poll docs. (b)/(c) change both clients and the share flow.'
    status: OPEN — decision needed; documented, not silently patched
  - id: KB-07
    severity: critical (app-killing) / high (data divergence)
    summary: >-
      Two coupled defects around suggested options: (a) app-side addOptionToPoll was
      Room-only — suggested options never reached the cloud poll doc; (b) a cloud
      vote referencing a web-suggested optionId CRASHED every Android client watching
      the poll (SQLiteConstraintException FK violation in the unguarded
      attachLiveCloudSync coroutine) — found by SYNC-06, 2026-11-28.
    fix: >-
      publishOptionToCloud (arrayUnion) added to addOptionToPoll;
      attachLiveCloudSync reconciles unknown optionIds (fetchPollOptionsFromCloud +
      upsert) before insertVotes and guards the whole sync in try/catch.
    verification: SYNC-06 re-run PASS on emulator (app showed the web-suggested
      option 100% / RSVP 1, no crash); APP-09's own UI pass blocked by automation
      traps (see its entry) — needs manual pass.
    status: FIXED and verified via SYNC-06 re-run 2026-11-28 — commit pending
# =============================================================================
# Hard-won automation lessons (adb + uiautomator against this Compose app)
# =============================================================================
automation_notes:
  stylus_overlay: >-
    Android 16 emulator pops Gboard's "Try out your stylus" handwriting overlay
    over the LOWER HALF of text-entry dialogs. It eats taps aimed at buttons
    underneath and reroutes typed text into its own input box (which commits via
    its Next button, polluting the field with garbage). Button centers on the
    Pixel 8 AVD: Cancel (500,1867), Next (716,1867), Reset (183,1867) — a tap at
    (567,1867) is DEAD SPACE between Cancel and Next (cost an hour of "broken
    dialog" debugging). It re-pops on new text focus; dismiss then act fast. It
    does NOT appear in uiautomator dumps of the app window — verify with a
    screenshot, not the dump.
  injection_immune_fields: >-
    SOME Compose text fields silently reject ALL programmatic text — adb input
    text, the MCP type tool, AND raw keyevents — while sibling fields accept the
    same injections in the same dialog. Confirmed immune (2026-11-28): the
    Suggest dialog's Date & Kickoff field, the VotingScreen notes field, the
    Account dialog's display-name field. Confirmed working: Suggest title +
    address, poll title, option fields. Pattern is NOT purely overlay coverage
    (immune fields reject text even after overlay dismissal with clean focus);
    suspected custom Compose input handling. Symptom: dump shows focused="true"
    with text staying empty after typed:true. Workaround: none found — these
    flows need a manual pass; verify what is verifiable via REST/logcat (e.g.
    rating buttons ARE tappable and their values reach the ballot).
  ime_covering_fields: >-
    The soft keyboard covers the bottom ~800 px. Taps/swipes aimed at covered
    fields land ON THE KEYS — a swipe starting on the keyboard TYPES into the
    focused field (observed: stray "by" typed into an option). Close the IME
    (adb shell input keyevent 4) and re-scroll before touching bottom fields.
  focus_verification: >-
    ALWAYS uiautomator-dump and check focused="true" on the target EditText
    BEFORE adb shell input text — text goes to whatever is focused, silently.
    (Observed: three fields' worth of text concatenated into the title field.)
    Repeated DEL clears a focused field: adb shell input keyevent 67 67 67 ...
  scrolling: >-
    Scroll with gutter swipes (x≈1040, never x<1000) so they can't touch
    fields or keys. The create form re-settles layout after IME close — re-dump
    after every scroll/keyboard transition; stale coordinates miss.
  space_encoding: adb shell input text uses %s for spaces; special chars may need %<hex>.
  invisible_clicks: >-
    A tap that "does nothing" may have worked — the create-form share dialog
    failed to render while the emulator was wedged (4 duplicate polls created).
    Verify effects via logcat/Firestore, not only via screen state.
  mcp_quirks: >-
    android-emulator MCP build_and_run / start_emulator time out at a 30 s
    harness cap but KEEP WORKING in the background — verify with adb devices /
    pgrep qemu instead of retrying. launch_app uses monkey and errored;
    use `adb shell am start -n com.plutusoft.livepulse/com.example.MainActivity`.
    ux-review cli.py: capture is interactive (needs keypresses); dump and perf
    are non-interactive. evaluate() in the browser cannot do dynamic import() —
    inject a <script type=module> into the page for SDK-level probes.

