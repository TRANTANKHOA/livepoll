# =============================================================================
# LivePulse E2E — Batch 3 — Write Paths Hunt (suggest-option, RSVP, deletion)
# ============================================================================
# Hunting bugs in the untested write paths: option suggestions from
# both clients, dangling-option votes, RSVP status changes, and the latent
# poll-deletion design defect. Fixture: fresh open poll in the local emulator.
# Shared context (environment, prerequisites, known_bugs, automation_notes,
# fixtures) lives in tests/common.yml. Conventions and coordinates there too.

version: 1
suite: livepulse-e2e-batch-03

tests:
# ---------------- Android app (Guest mode — no sign-in required) ----------
  - id: APP-09
    title: Suggest Option from VotingScreen reaches the cloud
    area: android-app
    steps:
      - 'VotingScreen → "Suggest Option" → submit a new option text'
      - REST: read the poll doc — options array length before vs after
    expected:
      - New option appears in the app's option list (Room insert)
      - Cloud poll doc options array GROWS by one (arrayUnion or equivalent)
    result: >-
      suspicion CONFIRMED as KB-07 (fixed 2026-11-28: publishOptionToCloud arrayUnion
      added to addOptionToPoll). UI-path verification BLOCKED by two compounding
      automation traps (2026-11-28, poll KXHFC7): (1) an Android system stylus-
      handwriting overlay ("Try out your stylus") periodically covers the dialog's
      lower half, swallowing Cancel taps and rerouting typed text into its own
      input box — dismiss it before interacting (see automation_notes); (2) even
      with the overlay dismissed, the required "Date & Kickoff / Start Time" field
      rejects ALL programmatic input — adb input text, MCP type tool, and raw
      keyevents (13 44 41) all leave it empty while fields 1-2 accept text
      identically. App validation correctly blocks submission without the date
      ("Please enter the date/time slot") — so the dialog cannot be completed
      programmatically. Fix is code-verified; the identical merge-write pattern
      (publishPollStatusToCloud, KB-06) is e2e-verified. Needs a manual UI pass.
    bug_ref: KB-07
  - id: APP-10
    title: Poll deletion (repository-level inspection)
    area: android-app
    detail: >-
      deletePoll exists in ViewModel + repository but NO screen calls it (verified
      by grep). By construction it can only clear Room — FirestoreService has no
      delete function at all, and the rules require an authenticated creator
      (publishPollToCloud never writes creatorId, so even signed-in creators could
      not delete). A UI delete wired as-is would orphan the cloud doc permanently —
      joiners would keep voting on a "deleted" poll. Latent design defect; fixing
      needs a decision (remove deletePoll, or tombstone + rules change).
    expected: no reachable UI path today; cloud orphan if ever wired as-is
    result: inspection recorded 2026-11-27 (no runtime execution possible)

  # ---------------- Web vote client (docs/vote.html) ------------------------
  - id: WEB-06
    title: "＋ Suggest another option (web) reaches cloud + renders"
    area: web-client
    steps:
      - On an allowCustomOptions poll, tap "＋ Suggest another option" → enter text
      - REST: read the poll doc — options array length before vs after
    expected:
      - Web renders the new option immediately (poll-doc onSnapshot)
      - Cloud options array GROWS by one (updateDoc arrayUnion)
    result: >-
      pass (2026-11-28, emulator poll KXHFC7): prompt() stubbed (automation context
      auto-dismisses JS dialogs — see automation_notes), suggested "Rooftop Bar
      Downtown"; web rendered it instantly (4→5 options) and the cloud options array
      grew to 5 with addedBy "Web voter".
  - id: WEB-07
    title: RSVP change to "Maybe" drops voter from going headcount
    area: web-client
    steps:
      - Vote as GOING → note headcount → Change my vote → pick "? Maybe" → Submit
    expected:
      - Headcount drops (only GOING voters counted) but total votes unchanged
      - App RSVP tab reflects the same voter set
    result: >-
      pass (2026-11-28, poll KXHFC7): GOING→MAYBE via Change-my-vote; web headcount
      dropped "1 going"→"0 going" with total unchanged (1 vote); app RSVP tab live-
      updated RSVP (1)→RSVP (0). NOTE: the change flow opens with NO options
      pre-selected — the voter must re-pick their whole selection from memory
      (multi-select UX defect candidate, not fixed).

  # ---------------- Cross-platform sync ------------------------------------
  - id: SYNC-06
    title: Web-suggested option voted on web — app renders the vote coherently
    area: sync
    steps:
      - Complete WEB-06, then vote on the web-suggested option
      - Watch the app's results screen — do NOT rejoin
    expected:
      - App learns the new option (poll-doc sync) and tallies the vote under it
      - If app never learns the option, the vote must still be counted in totals,
        not silently dropped nor crash the screen (dangling optionId handling)
    result: >-
      FAIL first run (2026-11-28, poll KXHFC7) — app CRASHED with
      SQLiteConstraintException FOREIGN KEY constraint failed: the cloud vote
      referenced the web-suggested optionId that Room didn't know, and the votes
      table FK (optionId → poll_options) rejected it inside the unguarded
      attachLiveCloudSync coroutine. Any web user voting on their own suggestion
      killed every Android client watching the poll. PASS on re-run after KB-07 fix:
      attachLiveCloudSync now reconciles unknown optionIds (fetchPollOptionsFromCloud
      + upsert) before insertVotes and guards the whole sync in try/catch; app showed
      "Rooftop Bar Downtown" 100% / RSVP (1), no crash.
    bug_ref: KB-07

  # ---------------- Environment / infrastructure ---------------------------
