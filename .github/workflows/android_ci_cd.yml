name: LivePulse CI/CD Pipeline

on:
  push:
    branches: [ main, 'release/*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make scripts executable
        run: chmod +x gradlew scripts/*.sh || true

      - name: Generate debug keystore
        # app/build.gradle.kts signingConfigs.debugConfig expects <repo-root>/debug.keystore
        # (gitignored). Recreate the standard Android debug key on CI.
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run Unit & JVM Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Upload Test Reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug

      - name: Upload Lint Report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release_bundle:
    name: Build Release Bundle (AAB)
    runs-on: ubuntu-latest
    needs: build_and_test
    # Opt-in: set repo variable RELEASE_ENABLED=true plus secrets
    # RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD (and optionally
    # WEB_CLIENT_ID for Google Sign-In) to activate.
    # (Key alias is fixed to "upload" in app/build.gradle.kts.)
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
        && vars.RELEASE_ENABLED == 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make scripts executable
        run: chmod +x gradlew scripts/*.sh || true

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_ENABLED is true but the RELEASE_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "Release keystore decoded successfully."

      - name: Write signing + auth secrets .env
        env:
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
        run: |
          if [ -n "$WEB_CLIENT_ID" ]; then
            printf 'WEB_CLIENT_ID=%s\n' "$WEB_CLIENT_ID" > .env
            echo "WEB_CLIENT_ID injected into .env."
          else
            echo "::warning::WEB_CLIENT_ID secret not set — the release bundle will ship without Google Sign-In configured."
          fi

      - name: Build Production Android App Bundle (AAB)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - name: Upload Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
