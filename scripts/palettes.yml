# LivePulse palette source of truth.
#
# Owned by scripts/palettes.py — DO NOT hand-edit ui/theme/Color.kt,
# docs/vote.html CSS vars, or ic_launcher_background.xml anymore.
#   python3 scripts/palettes.py list
#   python3 scripts/palettes.py show <name>
#   python3 scripts/palettes.py apply <name> [--dry-run]
#   python3 scripts/palettes.py preview <name> [--emulator]
#
# Conventions (YAML gotchas apply — see tests/common.yml automation_notes):
#   - hex values MUST be quoted:  primary_light: "#C2410C"
#   - palettes may extend a base with `extends: <name>` (deep merge;
#     concrete palettes must ultimately resolve every required token)
#   - bases set `abstract: true` and cannot be applied
#
# Required token groups on a RESOLVED palette:
#   brand      — primary/secondary/tertiary x light/dark x (on, container, on_container)
#   neutrals   — background/surface/surface_variant/on_surface/on_surface_variant/
#                outline/outline_variant/surface_container{,_low,_low,_high,_highest}
#                x light/dark + the 8 error tokens
#   status     — status_active, status_maybe, status_ending_soon, status_closed
#   categories — category_soccer, category_drinks, category_food,
#                category_decision, category_event, category_feedback
#   extras     — geometric_bar_fill(_dark), geometric_accent, top_winner_gold,
#                launcher_gradient_start, launcher_gradient_end

